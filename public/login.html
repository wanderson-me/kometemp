<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1914">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAndCine">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Entrar — WAndCine</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
<main class="login-wrap">
  <form id="login-form" class="login-card" autocomplete="on" novalidate>
    <div class="login-brand" id="login-brand-default">
      <span class="sidebar-mark">WC</span>
      <h1 class="brand">WAndCine</h1>
    </div>
    <div class="login-logo hidden" id="login-logo"><span class="brand-logo-disc"><img id="login-logo-img" alt="WAndCine" width="256" height="256"></span></div>
    <p class="login-sub">Catálogo pessoal. Entre para ver seus registros.</p>
    <div class="form-field">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="form-field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="login-error hidden" role="alert"></p>
    <button type="submit" class="btn-primary login-submit" id="login-btn">Entrar</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
