<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf6ee">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAndCine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WAndCine — filmes e séries</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand" id="brand-default">
      <span class="sidebar-mark">WC</span>
      <div>
        <h1 class="brand">WAndCine</h1>
        <p class="tagline">filmes e séries que já passaram por aqui</p>
      </div>
    </div>
    <a class="brand-logo hidden" id="brand-logo" href="/" aria-label="WAndCine">
      <span class="brand-logo-disc"><img id="brand-logo-img" alt="WAndCine" width="256" height="256"></span>
      <span class="brand-logo-name">WAndCine</span>
    </a>
    <button class="top-btn" id="top-search-btn" type="button" aria-label="Buscar" aria-expanded="false"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <nav class="side-nav">
      <button class="tab tab--movie" data-type="movie"><svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3zM7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></svg><span class="nav-dot"></span>Filmes<span class="tab-count" id="count-movie"></span></button>
      <button class="tab tab--series" data-type="series"><svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11H3zM8 21h8M12 16v5"/></svg><span class="nav-dot"></span>Séries<span class="tab-count" id="count-series"></span></button>
      <button class="tab tab--share" data-type="share"><svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span class="nav-dot"></span>Compartilhar</button>
      <button class="tab tab--more" id="more-btn" type="button" aria-haspopup="true" aria-expanded="false"><svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Mais</button>
    </nav>
    <div class="sidebar-foot">
      <button class="foot-link hidden" id="covers-btn" type="button">Buscar capas</button>
      <button class="foot-link" id="imdb-import-btn" type="button">Importar CSV do IMDb</button>
      <a class="foot-link" id="backup-link" href="/api/export?covers=1">Baixar backup</a>
      <button class="foot-link hidden" id="install-btn" type="button">Instalar app</button>
      <button class="foot-link foot-link--logo" id="logo-btn" type="button">Trocar logo</button>
      <button class="foot-link" id="logout-btn" type="button">Sair</button>
      <p class="tmdb-note hidden" id="tmdb-note">Capas: dados do TMDB. Este produto usa a API do TMDB, mas não é endossado nem certificado por ele.</p>
    </div>
  </aside>

  <div class="main">
    <section class="toolbar">
      <input type="search" id="search-input" placeholder="Buscar por título…">
      <div class="chips">
      <button type="button" class="chip-btn hidden" id="genre-chip" aria-expanded="false">Gêneros</button>
      <select id="rating-filter" aria-label="Filtrar por nota">
        <option value="all">Todas as notas</option>
        <optgroup label="Faixas">
          <option value="r:9-10">Nota 9–10</option>
          <option value="r:7-8">Nota 7–8</option>
          <option value="r:5-6">Nota 5–6</option>
          <option value="r:1-4">Nota 1–4</option>
          <option value="none">Sem nota</option>
        </optgroup>
        <optgroup label="Nota exata">
          <option value="n:10">Nota 10</option><option value="n:9">Nota 9</option><option value="n:8">Nota 8</option><option value="n:7">Nota 7</option><option value="n:6">Nota 6</option><option value="n:5">Nota 5</option><option value="n:4">Nota 4</option><option value="n:3">Nota 3</option><option value="n:2">Nota 2</option><option value="n:1">Nota 1</option>
        </optgroup>
      </select>
      <select id="sort-select">
        <option value="recent">Assistidos recentemente</option>
        <option value="title">Título (A–Z)</option>
        <option value="rating">Melhor nota</option>
      </select>
      </div>
      <button id="add-btn" class="btn-add">+ Adicionar</button>
    </section>

    <p id="filter-summary" class="filter-summary hidden" role="status"></p>

    <div id="import-result" class="import-result hidden" role="status"></div>

    <section id="share-view" class="share-view hidden"></section>

    <section id="stats" class="stats"></section>

    <div id="genre-breakdown" class="genre-breakdown"></div>

    <dialog id="form-panel" class="form-panel" aria-labelledby="modal-title"></dialog>
    <dialog id="detail-panel" class="form-panel detail-panel" aria-labelledby="detail-title"></dialog>

    <main id="list" class="list"></main>
    <p id="empty-state" class="empty hidden"></p>
  </div>
</div>
<div id="more-backdrop" class="more-backdrop"></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
