<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1914">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAndCine">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WAndCine — filmes e séries</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand" id="brand-default">
      <span class="sidebar-mark">WC</span>
      <div>
        <h1 class="brand">WAndCine</h1>
        <p class="tagline">filmes e séries que já passaram por aqui</p>
      </div>
    </div>
    <a class="brand-logo hidden" id="brand-logo" href="/" aria-label="WAndCine">
      <span class="brand-logo-disc"><img id="brand-logo-img" alt="WAndCine" width="256" height="256"></span>
      <span class="brand-logo-name">WAndCine</span>
    </a>
    <nav class="side-nav">
      <button class="tab tab--movie" data-type="movie"><span class="nav-dot"></span>Filmes<span class="tab-count" id="count-movie"></span></button>
      <button class="tab tab--series" data-type="series"><span class="nav-dot"></span>Séries<span class="tab-count" id="count-series"></span></button>
    </nav>
    <div class="sidebar-foot">
      <button class="foot-link hidden" id="covers-btn" type="button">Buscar capas</button>
      <button class="foot-link" id="imdb-import-btn" type="button">Importar CSV do IMDb</button>
      <a class="foot-link" id="backup-link" href="/api/export?covers=1">Baixar backup</a>
      <button class="foot-link hidden" id="install-btn" type="button">Instalar app</button>
      <button class="foot-link foot-link--logo" id="logo-btn" type="button">Trocar logo</button>
      <button class="foot-link" id="logout-btn" type="button">Sair</button>
      <p class="tmdb-note hidden" id="tmdb-note">Capas: dados do TMDB. Este produto usa a API do TMDB, mas não é endossado nem certificado por ele.</p>
    </div>
  </aside>

  <div class="main">
    <section class="toolbar">
      <input type="search" id="search-input" placeholder="Buscar por título…">
      <select id="rating-filter" aria-label="Filtrar por nota">
        <option value="all">Todas as notas</option>
        <optgroup label="Faixas">
          <option value="r:9-10">Nota 9–10</option>
          <option value="r:7-8">Nota 7–8</option>
          <option value="r:5-6">Nota 5–6</option>
          <option value="r:1-4">Nota 1–4</option>
          <option value="none">Sem nota</option>
        </optgroup>
        <optgroup label="Nota exata">
          <option value="n:10">Nota 10</option><option value="n:9">Nota 9</option><option value="n:8">Nota 8</option><option value="n:7">Nota 7</option><option value="n:6">Nota 6</option><option value="n:5">Nota 5</option><option value="n:4">Nota 4</option><option value="n:3">Nota 3</option><option value="n:2">Nota 2</option><option value="n:1">Nota 1</option>
        </optgroup>
      </select>
      <select id="sort-select">
        <option value="recent">Mais recentes</option>
        <option value="title">Título (A–Z)</option>
        <option value="rating">Melhor nota</option>
      </select>
      <button id="add-btn" class="btn-add">+ Adicionar</button>
    </section>

    <p id="filter-summary" class="filter-summary hidden" role="status"></p>

    <div id="import-result" class="import-result hidden" role="status"></div>

    <div id="movie-recap" class="movie-recap"></div>

    <section id="stats" class="stats"></section>

    <div id="genre-breakdown" class="genre-breakdown"></div>

    <div id="form-panel" class="form-panel hidden" data-type="movie"></div>

    <main id="list" class="list"></main>
    <p id="empty-state" class="empty hidden"></p>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
