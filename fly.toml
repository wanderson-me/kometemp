# Exemplo para Fly.io. Troque o nome do app (precisa ser único) e a região se quiser.
app = "meu-arquivo-wanderson"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  DATA_DIR = "/data"

[[mounts]]
  source = "meu_arquivo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
